<!DOCTYPE html>
<html lang="es">
<head>

<title>Interfaz 02/07/2026 — Miguel Ángel López</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1e6b3e;--mid:#29845a;--accent:#47b573;
  --pale:#e8f4ee;--pale2:#d4ecdf;--bg:#f0f7f3;--card:#ffffff;
  --bdr:#c4ddd0;--bdr2:#daeee3;
  --txt:#0c1e12;--muted:#3d6b52;--subtle:#6e9e82;
  --shadow:0 1px 3px rgba(8,30,15,.06),0 6px 20px rgba(8,30,15,.07);
  --shadow-sm:0 1px 2px rgba(8,30,15,.04),0 2px 8px rgba(8,30,15,.05);
  color-scheme: light only;
}
html{scroll-behavior:smooth;background:#f0f7f3 !important}
body{background:#f0f7f3 !important;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;color:#0c1e12 !important;-webkit-font-smoothing:antialiased}
#app,#main,#content,.trwrap,.tl,.stog-wrap{background:#f0f7f3 !important;color:#0c1e12 !important}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;max-height:0;transform:translateY(-4px)}to{opacity:1;max-height:1200px;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes checkBounce{0%{transform:scale(1)}30%{transform:scale(1.22)}65%{transform:scale(.9)}100%{transform:scale(1)}}
.fade-in{animation:fadeIn .22s ease both}
#main{transition:filter .22s ease,opacity .22s ease,transform .22s ease}
#main.day-blur{filter:blur(8px);opacity:0;transform:scale(.982)}
#content{transition:filter .18s ease,opacity .18s ease}
#content.content-blur{filter:blur(7px);opacity:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;box-shadow:0 0 40px rgba(8,30,15,.05)}
/* HEADER */
.hdr{background:var(--primary);padding:14px 20px 13px;display:flex;align-items:center;justify-content:space-between}
.hdr-l{display:flex;flex-direction:column;gap:1px}
.brand{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.hname{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.05}
.hdate{font-size:9px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.06em;margin-top:1px}
/* DAY BAR */
.dbar{background:var(--pale);padding:8px 12px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;border-bottom:1px solid var(--bdr)}
.dbtn{background:none;border:1.5px solid transparent;border-radius:9px;padding:7px 2px 5px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.dbtn:active{animation:pop .15s ease}
.dbtn.sel{background:#fff;border-color:var(--bdr)}
.dlab{font-family:'Syne',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.dbtn.sel .dlab{color:var(--primary)}
.ddot{width:5px;height:5px;border-radius:50%;margin:3px auto 2px}
.dtype{font-size:6.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);min-height:8px}
.dbtn.sel .dtype{color:var(--mid)}
.dhoy{font-size:7px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);min-height:8px}
/* BANNER */
.banner{background:var(--card);padding:16px 20px 13px;border-bottom:1px solid var(--bdr2);position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:var(--pale);opacity:.6}
.brow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative}
.bday{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1;color:var(--txt)}
.bact{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.btype{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 14px;border-radius:20px;flex-shrink:0;margin-top:3px}
.mchips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.chip{background:var(--pale);border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--primary);white-space:nowrap}
.chip.accent{background:var(--primary);color:#fff;border-color:var(--primary)}
/* TABS */
.tbar{background:var(--card);border-bottom:1px solid var(--bdr2);display:flex;padding:0 20px}
.tbtn{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);cursor:pointer;transition:color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.tbtn:active{animation:pop .12s ease}
.tbtn.sel{color:var(--primary);border-bottom-color:var(--primary)}
/* SNACK TOGGLE */
.stog-wrap{padding:13px 20px 4px}
.stog{background:none;border:1.5px solid var(--bdr);border-radius:20px;padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent}
.stog:hover{border-color:var(--mid);color:var(--primary)}
.stog.on{background:var(--pale);border-color:var(--mid);color:var(--primary)}
.stog:active{animation:pop .12s ease}
/* SLEEP */
.blk-card{background:var(--card);border:1px solid var(--bdr2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:10px}
.blk-hd{padding:12px 14px 10px;border-left:4px solid var(--primary);background:var(--pale)}
.blk-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--txt);letter-spacing:.01em}
.blk-range{font-size:10.5px;color:var(--subtle);font-weight:600;margin-top:2px}
.blk-body{padding:4px 0}
.blk-item{display:flex;align-items:baseline;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bdr2)}
.blk-item:last-child{border-bottom:none}
.blk-itime{font-family:'Syne',sans-serif;font-size:11px;font-weight:800;color:var(--primary);min-width:62px;flex-shrink:0}
.blk-idesc{font-size:13px;color:var(--txt);line-height:1.4}
.slp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px 10px}
.slp-stat{background:var(--card);border:1px solid var(--bdr2);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm)}
.slp-stat-lbl{font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
.slp-stat-val{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--txt)}
.slp-stat-val.slp-warn{color:#b5472b}
.slp-planb{background:var(--pale);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;margin-top:2px}
.slp-planb-lbl{font-family:'Syne',sans-serif;font-size:12.5px;font-weight:800;color:var(--primary);margin-bottom:4px}
.slp-planb-txt{font-size:12.5px;color:var(--muted);line-height:1.5}
/* TIMELINE */
.tl{padding:10px 20px 6px;position:relative}
.tl::before{content:'';position:absolute;left:36px;top:34px;bottom:28px;width:1.5px;background:linear-gradient(to bottom,var(--bdr),#e0ece6 80%,transparent);border-radius:2px}
.mrow{display:flex;gap:12px;margin-bottom:10px;position:relative}
.mnum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:14px;z-index:1;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px rgba(30,107,62,.2)}
.mcard{flex:1;background:var(--card);border:1px solid var(--bdr2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.mcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.mhd{padding:12px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mn{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--txt)}
.mitems{padding:0 14px 10px}
.mitem{display:flex;align-items:baseline;gap:9px;padding:4px 0;border-bottom:1px solid #f0f7f3;font-size:13px;color:var(--txt);line-height:1.4}
.mitem:last-child{border-bottom:none}
.idot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px}
.igram{font-size:11px;color:var(--subtle);font-weight:600;margin-left:auto;white-space:nowrap;flex-shrink:0}
.lightnote{font-size:10.5px;color:var(--muted);font-style:italic;padding:0 14px 7px;opacity:.9}
/* REEMPLAZOS */
.rep-btn{width:100%;background:none;border:none;border-top:1px solid var(--bdr2);padding:8px 14px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);cursor:pointer;display:flex;align-items:center;gap:5px;transition:color .15s,background .15s;text-align:left;-webkit-tap-highlight-color:transparent}
.rep-btn:hover{background:var(--pale);color:var(--muted)}
.rep-btn:active{animation:pop .1s ease}
.rep-btn .arr{font-size:10px;margin-left:auto;transition:transform .2s}
.rep-btn.open .arr{transform:rotate(180deg)}
.rep-panel{display:none;padding:10px 14px 12px;background:var(--pale);border-top:1px solid var(--bdr2);animation:slideDown .2s ease}
.rep-panel.open{display:block}
.rep-cat{margin-bottom:10px}
.rep-cat:last-child{margin-bottom:0}
.rep-cat-lbl{font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:block}
.rep-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--bdr2);font-size:12px;color:var(--txt)}
.rep-item:last-child{border-bottom:none}
.rep-g{font-size:11px;font-weight:700;color:var(--primary);background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:1px 8px;white-space:nowrap}
/* TRAINING */
.trwrap{padding:16px 20px;animation:fadeIn .2s ease}
.trlbl{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--txt);margin-bottom:3px}
.trfoc{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:14px}
.extbl{background:var(--card);border:1px solid var(--bdr2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:12px}
.exrow{display:grid;grid-template-columns:2.3fr .6fr .85fr 1fr .65fr;padding:9px 13px;border-bottom:1px solid var(--bdr2);font-size:12px;color:var(--txt);align-items:center;gap:4px}
.exrow:last-child{border-bottom:none}
.exrow.ehdr{background:var(--pale);font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 13px}
.exn{font-weight:600;color:var(--txt);font-size:12.5px}
.exv{font-family:'Syne',sans-serif;font-weight:800;color:var(--primary);font-size:12px}
.exd{font-size:10.5px;color:var(--subtle)}
.restcard{background:var(--card);border:1px solid var(--bdr2);border-radius:14px;padding:24px 16px;text-align:center;box-shadow:var(--shadow-sm)}
.resttl{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--muted);margin-bottom:5px}
.restds{font-size:12.5px;color:var(--subtle);margin-bottom:14px;line-height:1.5}
.sessitem{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--txt);border-bottom:1px solid var(--bdr2)}
.sessitem:last-child{border-bottom:none}
.note{margin:0 20px 6px;padding:9px 14px;background:var(--pale);border:1px solid var(--bdr);border-radius:10px;font-size:11px;color:var(--primary);font-weight:600;text-align:center}
/* LISTA DE COMPRA */
.shop-wrap{padding:6px 20px 20px}
.shop-btn{width:100%;background:var(--primary);border:none;border-radius:12px;padding:13px 16px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm)}
.shop-btn:hover{background:#175532}
.shop-btn:active{animation:pop .12s ease}
.shop-btn .arr{font-size:11px;transition:transform .2s}
.shop-btn.open{border-radius:12px 12px 0 0}
.shop-btn.open .arr{transform:rotate(180deg)}
.shop-panel{display:none;background:var(--card);border:1px solid var(--bdr2);border-top:none;border-radius:0 0 12px 12px;padding:14px 16px 16px;box-shadow:var(--shadow-sm)}
.shop-panel.open{display:block;animation:slideDown .22s ease}
.shop-intro{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.shop-cat{margin-bottom:13px}
.shop-cat:last-child{margin-bottom:0}
.shop-cat-lbl{font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:7px;display:block}
.shop-item{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--txt);border-bottom:1px solid var(--bdr2);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:opacity .12s}
.shop-item:last-child{border-bottom:none}
.shop-item:active{opacity:.7}
.shop-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--bdr);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.shop-item.done .shop-check{background:var(--primary);border-color:var(--primary);animation:checkBounce .32s ease}
.shop-item.done .shop-lbl{text-decoration:line-through;color:var(--subtle)}
.check-svg{display:none;width:11px;height:11px}
.shop-item.done .check-svg{display:block}
.shop-lbl{transition:color .15s}
</style>
</head>

function tap(freq=90,dur=0.11,vol=0.28){
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.28,ac.currentTime+dur);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur+.01);o.start();o.stop(ac.currentTime+dur+.02);}catch(e){}
}

// ── BLUR HELPER ───────────────────────────────────────────────
function withBlur(fn,target='main'){
  const cls=target==='main'?'day-blur':'content-blur';
  const el=document.getElementById(target);
  if(!el){fn();return;}
  el.classList.add(cls);
  setTimeout(()=>{
    fn();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const fresh=document.getElementById(target);
      if(fresh) fresh.classList.remove(cls);
    }));
  },210);
}

// ── TYPE CONFIG ───────────────────────────────────────────────
function tc(t){
  if(t==='gym') return {dot:'#1e6b3e',badge:'#1e6b3e',btxt:'#fff'};
  if(t==='thai') return {dot:'#b5472e',badge:'#b5472e',btxt:'#fff'};
  return           {dot:'#7fa891',badge:'#4a6858',btxt:'#fff'};
}

// ── RENDER BAR ────────────────────────────────────────────────
function renderBar(){
  document.getElementById('dbar').innerHTML=D.map((d,i)=>{
    const c=tc(d.type),sel=i===day,isTd=i===todayIdx;
    return `<button class="dbtn${sel?' sel':''}" onclick="setDay(${i})">
      <div class="dlab">${d.s}</div>
      <div class="ddot" style="background:${c.dot};${sel?`box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px ${c.dot}`:''}"></div>
      <div class="dtype">${d.sub}</div>
      <div class="dhoy">${isTd?'HOY':''}</div>
    </button>`;
  }).join('');
}

// ── MEAL CARD (sin horarios) ──────────────────────────────────
function mealCard(n,m,badge,btxt,note=''){
  const repId='rep_'+n+'_'+day;
  const itemsH=m.items.map(([lbl,g])=>
    `<div class="mitem"><div class="idot"></div><span>${lbl}</span>${g?`<span class="igram">${g}</span>`:''}</div>`
  ).join('');
  let repH='';
  if(m.rep&&m.rep.length){
    const cats=m.rep.map(k=>{
      const rows=REP[k].map(r=>`<div class="rep-item"><span>${r.n}</span><span class="rep-g">${r.g}</span></div>`).join('');
      return `<div class="rep-cat"><span class="rep-cat-lbl">${RCAT[k]}</span>${rows}</div>`;
    }).join('');
    repH=`<button class="rep-btn" id="btn_${repId}" onclick="toggleRep('${repId}')">
      <span>Reemplazos</span><span class="arr">▾</span>
    </button>
    <div class="rep-panel" id="${repId}">${cats}</div>`;
  }
  return `<div class="mrow">
    <div class="mnum" style="background:${badge};color:${btxt};">${n}</div>
    <div class="mcard">
      <div class="mhd"><div><div class="mn">${m.lbl}</div></div></div>
      ${note?`<div class="lightnote">${note}</div>`:''}
      <div class="mitems">${itemsH}</div>
      ${repH}
    </div>
  </div>`;
}

  const shopCats=(()=>{
    let idx=0;
    return Object.keys(SHOP).map(cat=>{
      const items=SHOP[cat].map(item=>{
        const i=idx++;
        const done=!!shopChecked[i];
        return `<div class="shop-item${done?' done':''}" id="si_${i}" onclick="toggleShopItem(${i})">
          <div class="shop-check"><svg class="check-svg" viewBox="0 0 11 9" fill="none"><polyline points="1,4.5 4,7.5 10,1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <span class="shop-lbl">${item}</span>
        </div>`;
      }).join('');
      return `<div class="shop-cat"><span class="shop-cat-lbl">${cat}</span>${items}</div>`;
    }).join('');
  })();
  document.getElementById('content').innerHTML=`
    <div class="stog-wrap">
      <button class="stog${snack?' on':''}" onclick="toggleSnack()">
        <span style="font-size:13px;">${snack?'−':'+'}</span> ${snack?'Quitar snack':'Agregar snack'}
      </button>
    </div>
    <div class="tl">
      ${mealCard(1,m.des,c.badge,c.btxt)}
      ${mealCard(2,m.alm,c.badge,c.btxt,almNote)}
      ${snack?mealCard('S',m.snk,'#7fa891','#fff'):''}
      ${mealCard(snack?4:3,cenaData,c.badge,c.btxt,snack?cenaData.note:'')}
    </div>
    <div class="note">Registra todo en Yazio — foto + descripción</div>
    <div class="shop-wrap" id="shopWrap">
      <button class="shop-btn${shopOpen?' open':''}" id="shopBtn" onclick="toggleShop()">
        <span>Lista de compra</span><span class="arr">▾</span>
      </button>
      <div class="shop-panel${shopOpen?' open':''}" id="shopPanel">
        <div class="shop-intro">Todo lo que necesitas según el plan. Las cantidades dependen de cuántas veces a la semana uses cada opción.</div>
        ${shopCats}
      </div>
    </div>`;
}

// ── EVENTS ────────────────────────────────────────────────────
window.setDay=function(i){
  tap(90,.11,.28);
  withBlur(()=>{day=i;snack=false;shopOpen=false;renderBar();renderMain();},'main');
};
window.setTab=function(t){
  tap(75,.11,.25);
  withBlur(()=>{tab=t;renderMain();},'main');
};
window.toggleSnack=function(){
  tap(65,.11,.25);
  withBlur(()=>{snack=!snack;renderMeals();},'content');
};
window.toggleShop=function(){
  tap(60,.11,.25);
  const wrap=document.getElementById('shopWrap');
  if(wrap){
    wrap.style.transition='filter .18s ease,opacity .18s ease';
    wrap.style.filter='blur(7px)';
    wrap.style.opacity='0.15';
    setTimeout(()=>{
      shopOpen=!shopOpen;
      const btn=document.getElementById('shopBtn'),panel=document.getElementById('shopPanel');
      if(btn) btn.classList.toggle('open',shopOpen);
      if(panel) panel.classList.toggle('open',shopOpen);
      if(wrap){wrap.style.filter='';wrap.style.opacity='';}
    },200);
  } else {
    shopOpen=!shopOpen;renderMeals();
  }
};
window.toggleShopItem=function(i){
  tap(90,.11,.28);
  shopChecked[i]=!shopChecked[i];
  const el=document.getElementById('si_'+i);
  if(el) el.classList.toggle('done',!!shopChecked[i]);
};
window.toggleRep=function(id){
  tap(55,.11,.22);
  const panel=document.getElementById(id),btn=document.getElementById('btn_'+id);
  if(!panel||!btn) return;
  const open=panel.classList.toggle('open');
  btn.classList.toggle('open',open);
  btn.querySelector('.arr').textContent=open?'▴':'▾';
};
